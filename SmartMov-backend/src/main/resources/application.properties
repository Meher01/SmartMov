spring.application.name=SmartMov-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/SmartMov}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

storage.local-directory=${STORAGE_LOCAL_DIRECTORY:uploads}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1